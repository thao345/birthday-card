<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Chúc Mừng Sinh Nhật Bé Iu 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Nền ảnh kỷ niệm trôi nổi -->
  <div class="photo-sky" id="photoSky">
    <div class="photo-frame p1"><img src="images/photo1.jpg" alt="" onerror="this.style.opacity=0"></div>
    <div class="photo-frame p2"><img src="images/photo2.jpg" alt="" onerror="this.style.opacity=0"></div>
    <div class="photo-frame p3"><img src="images/photo3.jpg" alt="" onerror="this.style.opacity=0"></div>
    <div class="photo-frame p4"><img src="images/photo4.jpg" alt="" onerror="this.style.opacity=0"></div>
    <div class="photo-frame p5"><img src="images/photo5.jpg" alt="" onerror="this.style.opacity=0"></div>
    <div class="photo-frame p6"><img src="images/photo6.jpg" alt="" onerror="this.style.opacity=0"></div>
  </div>

  <div class="vignette"></div>

  <main class="stage">
    <p class="hint" id="hint">chạm vào thiệp để mở ✨</p>

    <div class="card-wrapper" id="cardWrapper">
      <div class="card" id="card">

        <!-- Mặt trong: lời chúc -->
        <div class="inside">
          <div class="inside-glow"></div>
          <p class="eyebrow">Gửi đến Vi iu</p>
          <h1 class="headline">Chúc Mừng<br>Sinh Nhật<br><span>Bé iu</span></h1>
          <p class="message" id="messageText">Mỗi năm trôi qua, anh lại càng thấy may mắn vì có em bên cạnh. Chúc bé iu của anh mãi xinh đẹp, mãi vui vẻ và mãi là cô công chúa nhỏ trong lòng anh 💕</p>
          <div class="signature">— Hoàng Thảo —</div>
        </div>

        <!-- Nắp thiệp (mặt ngoài) -->
        <div class="cover" id="cover">
          <div class="cover-face">
            <div class="ribbon"></div>
            <div class="cover-content">
              <div class="heart-mark">♥</div>
              <p class="cover-title">Gửi Vi Iu</p>
              <p class="cover-sub">một điều đặc biệt đang chờ bên trong…</p>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <div class="burst-layer" id="burstLayer"></div>

  <script src="script.js"></script>
</body>
</html>
